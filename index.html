<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0620" />
  <title>เดชศาสตร์อนันต์</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="battleCanvas"></canvas>
  </div>

  <!-- Firebase CDN (Phase 5) — compat SDK ใช้ได้กับ vanilla JS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ลำดับสำคัญ: config → firebase → data → systems → assets → scenes → entry -->
  <script src="js/config.js"></script>
  <script src="js/systems/firebase.js"></script>
  <script src="js/data/math.js"></script>
  <script src="js/data/heroes.js"></script>
  <script src="js/data/bosses.js"></script>
  <script src="js/systems/audio.js"></script>
  <script src="js/systems/progress.js"></script>
  <script src="js/systems/gacha.js"></script>
  <script src="js/systems/daily.js"></script>
  <script src="js/systems/assets.js"></script>
  <script src="js/scenes/battle.js"></script>
  <script src="js/scenes/party-select.js"></script>
  <script src="js/scenes/gacha-scene.js"></script>
  <script src="js/scenes/menu.js"></script>
  <script src="js/scenes/tower.js"></script>
  <script src="js/scenes/daily-scene.js"></script>
  <script src="js/scenes/leaderboard-scene.js"></script>
  <script src="js/scenes/classroom-scene.js"></script>
  <script src="js/systems/scene-manager.js"></script>

  <script>
    var _gameCanvas = document.getElementById('battleCanvas');
    var W = CONFIG.CANVAS.BASE_WIDTH, H = CONFIG.CANVAS.BASE_HEIGHT;

    // resize — ใช้ visualViewport เพื่อแก้ iOS Safari address bar bug
    function resizeGame() {
      var vw = window.visualViewport ? window.visualViewport.width  : window.innerWidth;
      var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      var s = Math.min(vw / W, vh / H);
      _gameCanvas.style.width  = W * s + 'px';
      _gameCanvas.style.height = H * s + 'px';
    }
    _gameCanvas.width  = W;
    _gameCanvas.height = H;
    resizeGame();
    window.addEventListener('resize', resizeGame);
    // iOS Safari: visualViewport resize จับ address bar hide/show ได้แม่นกว่า window.resize
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeGame);
    }

    // Loading screen จนกว่ารูปจะพร้อม
    var loadCtx = _gameCanvas.getContext('2d');

    function drawLoading(loaded, total) {
      loadCtx.fillStyle = '#0d0620';
      loadCtx.fillRect(0, 0, W, H);

      // stars
      loadCtx.fillStyle = 'rgba(255,255,255,0.3)';
      for (var i = 0; i < 30; i++) {
        loadCtx.beginPath();
        loadCtx.arc((i*137.5)%W, (i*97.3)%H, 1, 0, Math.PI*2);
        loadCtx.fill();
      }

      // title
      loadCtx.fillStyle = '#FFD700';
      loadCtx.font = 'bold 28px sans-serif';
      loadCtx.textAlign = 'center';
      loadCtx.fillText('เดชศาสตร์อนันต์', W/2, H*0.38);

      loadCtx.fillStyle = '#CC99FF';
      loadCtx.font = '15px sans-serif';
      loadCtx.fillText('วีรบุรุษพลิกสูตรจักรวาล', W/2, H*0.46);

      // progress bar
      var pct  = total > 0 ? loaded / total : 0;
      var bW = W * 0.7, bH = 10;
      var bX = (W - bW) / 2, bY = H * 0.56;

      loadCtx.fillStyle = '#222';
      loadCtx.beginPath();
      loadCtx.roundRect ? loadCtx.roundRect(bX, bY, bW, bH, 5) : loadCtx.rect(bX, bY, bW, bH);
      loadCtx.fill();

      loadCtx.fillStyle = '#9933FF';
      if (pct > 0) {
        loadCtx.beginPath();
        loadCtx.roundRect ? loadCtx.roundRect(bX, bY, bW*pct, bH, 5) : loadCtx.rect(bX, bY, bW*pct, bH);
        loadCtx.fill();
      }

      loadCtx.fillStyle = 'rgba(255,255,255,0.6)';
      loadCtx.font = '12px sans-serif';
      loadCtx.fillText('กำลังโหลด... ' + loaded + '/' + total, W/2, bY + bH + 22);
      loadCtx.textAlign = 'left';
    }

    // วาด loading เริ่มต้น
    drawLoading(0, Object.keys(ASSET_PATHS.heroes).length +
                   Object.keys(ASSET_PATHS.bosses).length +
                   Object.keys(ASSET_PATHS.bg).length);

    // โหลดรูปทั้งหมด แล้วเริ่มเกม
    loadAllAssets(
      function() {
        // Phase 5: init Firebase (ถ้า config พร้อม)
        SUPA.init();
        // เช็ค login streak แล้วเริ่มเกม
        var _bootSave = loadProgress();
        _bootSave = checkLoginStreak(_bootSave);
        saveProgress(_bootSave);
        // sync user profile ถ้ามี nickname
        if (SUPA.isReady() && _bootSave.nickname) {
          SUPA.upsertUser(_bootSave, null);
        }
        SCENE.switch('menu', _gameCanvas);
      },
      function(loaded, total) {
        drawLoading(loaded, total);
      }
    );
  </script>
</body>
</html>
